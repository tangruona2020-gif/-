[project]
name = "goods-popup-monitor"
version = "0.1.0"
description = "Extensible Japanese pop-up event monitor"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.4",
  "beautifulsoup4==4.13.4",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "pillow==11.3.0",
  "playwright==1.54.0",
  "pydantic-settings==2.10.1",
  "python-dateutil==2.9.0.post0",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.42",
  "tenacity==9.1.2",
  "uvicorn==0.35.0",
]
[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pre-commit==4.2.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
addopts = "-m 'not integration'"
testpaths = ["tests"]
norecursedirs = [".venv", "data", "tools"]
markers = ["integration: accesses a live web site"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI's Depends() is intentionally evaluated in defaults.
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
