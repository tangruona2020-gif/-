{% extends "base.html" %}{% block content %}<section class="cards"><article><strong>{{ stats.sources }}</strong><span>启用来源</span></article><article><strong>{{ stats.ips }}</strong><span>启用 IP</span></article><article><strong>{{ stats.events }}</strong><span>活动</span></article></section><h2>最近扫描</h2><table><tr><th>ID</th><th>状态</th><th>卡片</th><th>命中</th><th>错误</th></tr>{% for s in scans %}<tr><td>{{s.id}}</td><td>{{s.status}}</td><td>{{s.discovered_card_count}}</td><td>{{s.matched_ip_count}}</td><td>{{s.error_message or ''}}</td></tr>{% else %}<tr><td colspan="5">尚无扫描记录</td></tr>{% endfor %}</table>{% endblock %}
